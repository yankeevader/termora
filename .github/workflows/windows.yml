name: Tunnelkeeper Windows Portable

on:
  push:
    branches: [otm-ui]
  pull_request:
    branches: [otm-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The Gradle dependency repackaging task uses Info-ZIP's zip/unzip CLI.
      # Never fetch unsigned executables over HTTP into System32.
      - name: Install archive tools
        shell: pwsh
        run: |
          choco install zip unzip --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { exit $LASTEXITCODE }
          Get-Command zip.exe -ErrorAction Stop | Select-Object -ExpandProperty Source
          Get-Command unzip.exe -ErrorAction Stop | Select-Object -ExpandProperty Source

      - name: Install JetBrains Runtime 21
        shell: pwsh
        env:
          JBR_VERSION: "21.0.8"
          JBR_BUILD: "b1138.52"
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'jbrsdk.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'jbrsdk'
          $url = "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-$($env:JBR_VERSION)-windows-x64-$($env:JBR_BUILD).zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $jdk = Get-ChildItem -LiteralPath $destination -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'bin\java.exe') } |
            Select-Object -First 1
          if ($null -eq $jdk) { throw "Java runtime not found in extracted JBR archive" }
          "JAVA_HOME=$($jdk.FullName)" >> $env:GITHUB_ENV
          "$($jdk.FullName)\bin" >> $env:GITHUB_PATH

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: windows-x64-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            windows-x64-gradle-

      - name: Build Tunnelkeeper portable ZIP
        shell: pwsh
        run: |
          .\gradlew.bat :check-license :portableDist --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check portable package and write SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem -Path 'build/distributions' -Filter '*-windows-*-portable.zip' -File)
          if ($packages.Count -ne 1) { throw "Expected one portable ZIP, found $($packages.Count)" }
          $package = $packages[0]
          $entries = (& tar -tf $package.FullName) -replace '\\', '/'
          if ($LASTEXITCODE -ne 0) { throw "Failed to read portable ZIP" }
          if (-not ($entries | Where-Object { $_ -eq 'Tunnelkeeper/Tunnelkeeper.exe' })) {
            throw "Portable ZIP is missing Tunnelkeeper.exe"
          }
          if (-not ($entries | Where-Object { $_ -match '^Tunnelkeeper/runtime/' })) {
            throw "Portable ZIP is missing its bundled Java runtime"
          }
          if (-not ($entries | Where-Object { $_ -match '^Tunnelkeeper/data/?
          "$hash  $($package.Name)" | Set-Content -LiteralPath "$($package.FullName).sha256" -Encoding ascii
          Write-Host "Verified portable build: $($package.Name)"

      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Tunnelkeeper-Windows-x64-portable
          path: |
            build/distributions/*-windows-*-portable.zip
            build/distributions/*-windows-*-portable.zip.sha256
          if-no-files-found: error
          retention-days: 30
 })) {
            throw "Portable ZIP is missing its writable data folder"
          }
          $cfgPath = 'Tunnelkeeper/app/Tunnelkeeper.cfg'
          if (-not ($entries | Where-Object { $_ -eq $cfgPath })) {
            throw "Portable ZIP is missing its launcher config"
          }
          $cfgContents = (& tar -xOf $package.FullName $cfgPath) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $cfgContents -notmatch 'java-options=-Djpackage\.app-layout=zip') {
            throw "Portable ZIP is missing the ZIP-layout Java option"
          }
          $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($package.Name)" | Set-Content -LiteralPath "$($package.FullName).sha256" -Encoding ascii
          Write-Host "Verified portable build: $($package.Name)"

      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Tunnelkeeper-Windows-x64-portable
          path: |
            build/distributions/*-windows-*-portable.zip
            build/distributions/*-windows-*-portable.zip.sha256
          if-no-files-found: error
          retention-days: 30
